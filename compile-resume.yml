name: Compile LaTeX resumes

on:
  push:
    paths:
      - "resumes/tex/**/*.tex"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      
      - name: Create PDF directory
        run: mkdir -p resumes/pdf
      
      - name: Compile all .tex files
        run: |
          cd resumes/tex
          for texfile in *.tex; do
            if [ -f "$texfile" ]; then
              echo "=== Compiling $texfile ==="
              pdflatex -interaction=nonstopmode -output-directory=../pdf "$texfile"
              # Run twice for proper references
              pdflatex -interaction=nonstopmode -output-directory=../pdf "$texfile"
              echo "=== Finished $texfile ==="
            fi
          done
      
      - name: List generated PDFs
        run: |
          echo "Contents of resumes/pdf:"
          ls -lah resumes/pdf/
      
      - name: Upload PDFs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: resumes-pdf
          path: resumes/pdf/*.pdf
        continue-on-error: true
      
      - name: Commit PDFs to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): add compiled PDFs"
          file_pattern: "resumes/pdf/*.pdf" 

